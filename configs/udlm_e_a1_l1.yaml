defaults:
  - udlm_e_l1
  - _self_

# Prospective 500-update BERT-FiLM treatment under an L1 scheduler decision.
# It starts independently from the same MDLM EMA checkpoint as A0.
training:
  reseed_after_model_initialization: true
  udlm:
    conditioning_variant: film_adaln
    zero_init_conditioning: false
