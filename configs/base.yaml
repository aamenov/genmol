hydra:
  run:
    dir: ckpt/tmp
  job:
    chdir: True

data: safe
seed: 1

wandb:
  project: genmol
  name: null

loader:
  global_batch_size: 2048
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: 32
  pin_memory: True

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  # This explicit block preserves the released GenMol schedule. Checkpoints
  # created before the block existed receive the same values as a strict
  # backward-compatible fallback in model.py.
  scheduler:
    name: constant_with_linear_warmup
    warmup_updates: 2500
    horizon_updates: null
    decay_floor_lr: null

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  # The reviewed pilot launcher overrides this to true. Release/manual
  # training keeps Lightning's normal, lower-overhead backward path.
  detect_anomaly: False
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  max_steps: 50000
  log_every_n_steps: 10

model:
  attention_probs_dropout_prob: 0.1
  classifier_dropout: null
  hidden_act: 'gelu'
  hidden_dropout_prob: 0.1
  hidden_size: 768
  initializer_range: 0.02
  intermediate_size: 3072
  layer_norm_eps: 1e-12
  max_position_embeddings: 256
  model_type: 'bert'
  num_attention_heads: 12
  num_hidden_layers: 12
  pad_token_id: 3
  position_embedding_type: 'absolute'
  torch_dtype: 'float32'
  type_vocab_size: 2
  use_cache: True
  vocab_size: 1880

noise:
  type: loglinear

training:
  # Missing in legacy checkpoints; model.py deliberately defaults it to mdlm.
  diffusion: mdlm  # mdlm / udlm
  T: 0  # 0 (continuous time) / 1000
  ema: 0.9999
  antithetic_sampling: True
  sampling_eps: 1e-3
  global_mean_loss: True
  # This guard is activated only by the reviewed pilot launcher. Keeping the
  # default false preserves released/manual training behavior.
  pilot_fail_on_nonfinite_loss: False
  # Within each process-local microbatch, sum token losses and divide by its
  # token count. DDP and gradient accumulation then average those local ratios;
  # they do not form one exact token ratio across ranks/accumulation windows.
  # This matches the released GenMol reduction. Longer sequences supply more
  # summands to their local ratio; equal-per-sequence mode weights them differently.
  use_bracket_safe: False
  # Explicit initialization is distinct from Lightning checkpoint resume.
  # Set only for a UDLM warm-start experiment.
  init_from_mdlm_checkpoint: null
  # Launchers pin this digest so the warm-start loader can prove that it read
  # the same bytes selected before shared-GPU scheduling began. Legacy/manual
  # runs may leave it null; stable before/after descriptor checks still apply.
  init_from_mdlm_checkpoint_sha256: null
  init_from_mdlm_ema: True
  # Architecture screens opt in to a second launch-bound seed after model
  # construction/warm-start so extra A1 parameters cannot shift the shared
  # dropout, time-sampling, or corruption RNG streams.
  reseed_after_model_initialization: False
  udlm:
    # The released UDLM uses all vocabulary entries. Excluding tokenizer
    # control symbols is a separate molecule-specific ablation.
    exclude_special_tokens: False
    # `release_uniform` preserves the current official-UDLM-compatible process
    # and old UDLM checkpoint state exactly. `schedule_uniform` changes only to
    # the exact residual-clean schedule in ContinuousCategoricalDiffusion and
    # is the required control for `empirical_frequency`. The empirical variant
    # must never be compared only against release_uniform, because that would
    # conflate the schedule repair with the non-uniform prior. Categorical
    # training optimizes the model-dependent continuous-time integral; its
    # parameter-independent endpoint KL is available separately on the process.
    prior_variant: release_uniform
    # For empirical_frequency, pi=(1-w)*frequency + w*uniform on the active
    # alphabet. Require 0<w<1: positive uniform mass gives every active token
    # support, while positive empirical mass keeps the treatment non-uniform.
    empirical_uniform_mix: 0.01
    noise_eps: 1e-3
    inference_eps: 1e-5
    # 128 matches the official continuous-time sampling default. Smaller
    # 32/64-step values are speed ablations and must be labeled as such.
    sampling_steps: 128
    time_embedding_size: 256
    # Additive is the reviewed A0 path and preserves all existing UDLM state
    # keys. The prospective film_adaln A1 arm is a separately registered BERT
    # adaptation and requires zero_init_conditioning=false.
    conditioning_variant: additive
    zero_init_conditioning: True

callback:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${cwd:}/checkpoints
  filename: '{step}'
  save_top_k: -1  # to save every n train steps
  auto_insert_metric_name: False
  enable_version_counter: False
  every_n_train_steps: 5000
