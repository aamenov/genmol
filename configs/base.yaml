hydra:
  run:
    dir: ckpt/tmp
  job:
    chdir: True

data: safe
seed: 1

wandb:
  project: genmol
  name: null

loader:
  global_batch_size: 2048
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: 32
  pin_memory: True

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  max_steps: 50000
  log_every_n_steps: 10

model:
  attention_probs_dropout_prob: 0.1
  classifier_dropout: null
  hidden_act: 'gelu'
  hidden_dropout_prob: 0.1
  hidden_size: 768
  initializer_range: 0.02
  intermediate_size: 3072
  layer_norm_eps: 1e-12
  max_position_embeddings: 256
  model_type: 'bert'
  num_attention_heads: 12
  num_hidden_layers: 12
  pad_token_id: 3
  position_embedding_type: 'absolute'
  torch_dtype: 'float32'
  type_vocab_size: 2
  use_cache: True
  vocab_size: 1880

noise:
  type: loglinear

training:
  # Missing in legacy checkpoints; model.py deliberately defaults it to mdlm.
  diffusion: mdlm  # mdlm / udlm
  T: 0  # 0 (continuous time) / 1000
  ema: 0.9999
  antithetic_sampling: True
  sampling_eps: 1e-3
  global_mean_loss: True
  # Within each process-local microbatch, sum token losses and divide by its
  # token count. DDP and gradient accumulation then average those local ratios;
  # they do not form one exact token ratio across ranks/accumulation windows.
  # This matches the released GenMol reduction. Longer sequences supply more
  # summands to their local ratio; equal-per-sequence mode weights them differently.
  use_bracket_safe: False
  # Explicit initialization is distinct from Lightning checkpoint resume.
  # Set only for a UDLM warm-start experiment.
  init_from_mdlm_checkpoint: null
  init_from_mdlm_ema: True
  udlm:
    # The released UDLM uses all vocabulary entries. Excluding tokenizer
    # control symbols is a separate molecule-specific ablation.
    exclude_special_tokens: False
    noise_eps: 1e-3
    inference_eps: 1e-5
    # 128 matches the official continuous-time sampling default. Smaller
    # 32/64-step values are speed ablations and must be labeled as such.
    sampling_steps: 128
    time_embedding_size: 256
    zero_init_conditioning: True

callback:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${cwd:}/checkpoints
  filename: '{step}'
  save_top_k: -1  # to save every n train steps
  auto_insert_metric_name: False
  enable_version_counter: False
  every_n_train_steps: 5000
