defaults:
  - udlm_e_l0
  - _self_

# Prospective 500-update BERT-FiLM treatment under an L0 scheduler decision.
# The timestep MLP is normally initialized; only per-layer FiLM projections
# are zero, preserving exact MDLM logits without killing FiLM gradients.
training:
  reseed_after_model_initialization: true
  udlm:
    conditioning_variant: film_adaln
    zero_init_conditioning: false
