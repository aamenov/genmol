schema_version: 1
experiment_id: fragment_vocab_smoke_40k_v1
scientific_status: >-
  Engineering smoke test using a preliminary 40k checkpoint, one seed, a
  shortened warmup, and a 200-call budget. Not comparable with the paper.
model_path: outputs/paper_v1/checkpoints/40000.ckpt
tasks:
  - oracle: qed
    gamma: 0.0
    # The original ZINC molecule-level mean was discarded. This neutral prior
    # is a declared smoke-test proxy, not the preregistered full-run prior.
    prior_mean: 0.5
    prior_mean_source: fixed neutral smoke-test proxy; initial corpus metadata unavailable
variants:
  - released
  - running_mean
  - support3
  - shrink10
  - running_mean_parent_control
  - delta
seeds: [0]
stop_on_failure: true
common:
  output_root: output/pmo_ablation
  max_oracle_calls: 200
  reporting_frequency: 20
  checkpoint_every: 20
  max_iterations: 2000
  population_size: 100
  warmup: 20
  legacy_warmup_off_by_one: true
  softmax_temp: 1.2
  randomness: 2.0
  guidance_scale: 2.0
  legacy_seed_count: 1
  delta_attribution: novel_vs_parent
  durable_events: true
