schema_version: 1
experiment_id: fragment_vocab_micro_40k_v1
scientific_status: >-
  Five-call end-to-end engineering check using the preliminary 40k checkpoint.
  This run validates model loading, generation, oracle accounting, logging, and
  checkpointing only; it is not evidence about algorithm quality and is not
  comparable with the paper.
model_path: outputs/paper_v1/checkpoints/40000.ckpt
tasks:
  - oracle: qed
    gamma: 0.0
variants:
  - released
seeds: [0]
stop_on_failure: true
common:
  output_root: output/pmo_ablation
  max_oracle_calls: 5
  reporting_frequency: 1
  checkpoint_every: 1
  max_iterations: 50
  population_size: 100
  warmup: 2
  legacy_warmup_off_by_one: true
  softmax_temp: 1.2
  randomness: 2.0
  guidance_scale: 2.0
  legacy_seed_count: 1
  delta_attribution: novel_vs_parent
  durable_events: true
